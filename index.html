
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Face Attendance System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .danger {
            background: #dc2626;
        }

        .success {
            background: #16a34a;
        }

        #camera {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            display: block;
            margin: 15px auto;
            background: black;
        }

        #message {
            margin-top: 15px;
            padding: 10px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1f2937;
            color: white;
        }

        .hidden {
            display: none;
        }

        @media(max-width:600px) {
            .container {
                width: 95%;
            }

            button {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Face Recognition Attendance System</h1>
    <p>Smart Attendance Management</p>
</header>

<div class="container">

    <!-- LOGIN / REGISTER -->
    <div class="card" id="authSection">

        <h2>Login / Register</h2>

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button id="registerBtn">
            Register
        </button>

        <button id="loginBtn">
            Login
        </button>

        <p id="authMessage"></p>

    </div>


    <!-- STUDENT DETAILS -->
    <div class="card hidden" id="studentSection">

        <h2>Student Details</h2>

        <input
            type="text"
            id="studentName"
            placeholder="Student Name"
        >

        <input
            type="text"
            id="studentId"
            placeholder="Student ID"
        >

        <button class="success" id="saveStudentBtn">
            Save Student
        </button>

        <p id="studentMessage"></p>

    </div>


    <!-- FACE CAMERA -->
    <div class="card hidden" id="faceSection">

        <h2>Face Recognition</h2>

        <p>
            Allow camera access and capture your face.
        </p>

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

        <button id="startCameraBtn">
            Start Camera
        </button>

        <button id="captureBtn">
            Capture Face
        </button>

        <canvas id="canvas" class="hidden"></canvas>

        <p id="faceMessage"></p>

    </div>


    <!-- ATTENDANCE -->
    <div class="card hidden" id="attendanceSection">

        <h2>Mark Attendance</h2>

        <p>
            Student:
            <strong id="displayStudentName">-</strong>
        </p>

        <p>
            Student ID:
            <strong id="displayStudentId">-</strong>
        </p>

        <button class="success" id="attendanceBtn">
            Mark Attendance
        </button>

        <p id="attendanceMessage"></p>

    </div>


    <!-- ATTENDANCE TABLE -->
    <div class="card hidden" id="dashboardSection">

        <h2>Attendance Dashboard</h2>

        <button id="loadAttendanceBtn">
            Load Attendance
        </button>

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Student ID</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="attendanceTable">
            </tbody>

        </table>

        <br>

        <button class="danger" id="logoutBtn">
            Logout
        </button>

    </div>

</div>


<script type="module">

    /* ==============================
       FIREBASE IMPORTS
    ============================== */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        query,
        orderBy,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* ==============================
       FIREBASE CONFIG
    ============================== */

    const firebaseConfig = {

        apiKey: "AIzaSyC8KMuO0yg9gN4MD3Y3CV8YNWsKCvV8L-Y",

        authDomain:
        "face-recognition-attenda-328c0.firebaseapp.com",

        projectId:
        "face-recognition-attenda-328c0",

        storageBucket:
        "face-recognition-attenda-328c0.firebasestorage.app",

        messagingSenderId:
        "289877248453",

        appId:
        "1:289877248453:web:30db49d06316a402e123ac"
    };


    /* ==============================
       INITIALIZE FIREBASE
    ============================== */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    console.log("Firebase connected successfully!");


    /* ==============================
       HTML ELEMENTS
    ============================== */

    const email =
        document.getElementById("email");

    const password =
        document.getElementById("password");

    const registerBtn =
        document.getElementById("registerBtn");

    const loginBtn =
        document.getElementById("loginBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");


    const authSection =
        document.getElementById("authSection");

    const studentSection =
        document.getElementById("studentSection");

    const faceSection =
        document.getElementById("faceSection");

    const attendanceSection =
        document.getElementById("attendanceSection");

    const dashboardSection =
        document.getElementById("dashboardSection");


    /* ==============================
       REGISTER
    ============================== */

    registerBtn.addEventListener("click", async () => {

        try {

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email.value,
                    password.value
                );

            document.getElementById(
                "authMessage"
            ).innerText =
                "Registration successful!";

            console.log(
                "User:",
                userCredential.user
            );

        } catch (error) {

            document.getElementById(
                "authMessage"
            ).innerText =
                error.message;

        }

    });


    /* ==============================
       LOGIN
    ============================== */

    loginBtn.addEventListener("click", async () => {

        try {

            await signInWithEmailAndPassword(
                auth,
                email.value,
                password.value
            );

            document.getElementById(
                "authMessage"
            ).innerText =
                "Login successful!";

        } catch (error) {

            document.getElementById(
                "authMessage"
            ).innerText =
                error.message;

        }

    });


    /* ==============================
       AUTH STATE
    ============================== */

    onAuthStateChanged(auth, (user) => {

        if (user) {

            authSection.classList.add("hidden");

            studentSection.classList.remove("hidden");

            faceSection.classList.remove("hidden");

            attendanceSection.classList.remove("hidden");

            dashboardSection.classList.remove("hidden");

        } else {

            authSection.classList.remove("hidden");

            studentSection.classList.add("hidden");

            faceSection.classList.add("hidden");

            attendanceSection.classList.add("hidden");

            dashboardSection.classList.add("hidden");

        }

    });


    /* ==============================
       SAVE STUDENT
    ============================== */

    document
        .getElementById("saveStudentBtn")
        .addEventListener("click", async () => {

            const name =
                document.getElementById(
                    "studentName"
                ).value;

            const id =
                document.getElementById(
                    "studentId"
                ).value;

            if (!name || !id) {

                document.getElementById(
                    "studentMessage"
                ).innerText =
                    "Please enter student name and ID.";

                return;
            }

            try {

                await addDoc(
                    collection(db, "students"),
                    {

                        name: name,

                        studentId: id,

                        email: auth.currentUser.email,

                        createdAt: serverTimestamp()

                    }
                );

                document.getElementById(
                    "studentMessage"
                ).innerText =
                    "Student saved to Firebase!";

                document.getElementById(
                    "displayStudentName"
                ).innerText = name;

                document.getElementById(
                    "displayStudentId"
                ).innerText = id;

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "studentMessage"
                ).innerText =
                    "Error saving student.";

            }

        });


    /* ==============================
       CAMERA
    ============================== */

    const camera =
        document.getElementById("camera");

    let stream = null;


    document
        .getElementById("startCameraBtn")
        .addEventListener("click", async () => {

            try {

                stream =
                    await navigator.mediaDevices
                    .getUserMedia({
                        video: true
                    });

                camera.srcObject = stream;

                document.getElementById(
                    "faceMessage"
                ).innerText =
                    "Camera started.";

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "faceMessage"
                ).innerText =
                    "Camera permission denied.";

            }

        });


    /* ==============================
       CAPTURE FACE
    ============================== */

    document
        .getElementById("captureBtn")
        .addEventListener("click", () => {

            const canvas =
                document.getElementById("canvas");

            canvas.width = camera.videoWidth;

            canvas.height = camera.videoHeight;

            const context =
                canvas.getContext("2d");

            context.drawImage(
                camera,
                0,
                0,
                canvas.width,
                canvas.height
            );

            document.getElementById(
                "faceMessage"
            ).innerText =
                "Face captured successfully.";

        });


    /* ==============================
       MARK ATTENDANCE
    ============================== */

    document
        .getElementById("attendanceBtn")
        .addEventListener("click", async () => {

            const name =
                document.getElementById(
                    "studentName"
                ).value;

            const studentId =
                document.getElementById(
                    "studentId"
                ).value;


            if (!name || !studentId) {

                document.getElementById(
                    "attendanceMessage"
                ).innerText =
                    "Enter student details first.";

                return;
            }


            try {

                const now = new Date();

                await addDoc(
                    collection(db, "attendance"),
                    {

                        name: name,

                        studentId: studentId,

                        date:
                            now.toLocaleDateString(),

                        time:
                            now.toLocaleTimeString(),

                        status: "Present",

                        userId:
                            auth.currentUser.uid,

                        createdAt:
                            serverTimestamp()

                    }
                );


                document.getElementById(
                    "attendanceMessage"
                ).innerText =
                    "Attendance marked successfully!";


            } catch (error) {

                console.error(error);

                document.getElementById(
                    "attendanceMessage"
                ).innerText =
                    "Error marking attendance.";

            }

        });


    /* ==============================
       LOAD ATTENDANCE
    ============================== */

    document
        .getElementById("loadAttendanceBtn")
        .addEventListener("click", async () => {

            const table =
                document.getElementById(
                    "attendanceTable"
                );

            table.innerHTML = "";

            try {

                const q = query(
                    collection(db, "attendance"),
                    orderBy("createdAt", "desc")
                );

                const snapshot =
                    await getDocs(q);


                snapshot.forEach((doc) => {

                    const data = doc.data();

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `

                        <td>${data.name || ""}</td>

                        <td>${data.studentId || ""}</td>

                        <td>${data.date || ""}</td>

                        <td>${data.time || ""}</td>

                        <td>${data.status || ""}</td>

                    `;

                    table.appendChild(row);

                });

            } catch (error) {

                console.error(error);

                table.innerHTML = `
                    <tr>
                        <td colspan="5">
                            Unable to load attendance.
                        </td>
                    </tr>
                `;

            }

        });


    /* ==============================
       LOGOUT
    ============================== */

    logoutBtn.addEventListener("click", async () => {

        try {

            await signOut(auth);

            alert("Logged out successfully.");

        } catch (error) {

            console.error(error);

        }

    });

</script>

</body>
</html>
